# 容器内 nginx 配置（web 镜像专用）
# 入口：宿主 nginx → 127.0.0.1:3100（compose 已映射）→ 本容器 :80
#
# 路由：
#   /                → 跳转 /screen/ （大屏端默认首页）
#   /screen/...      → 静态托管 teacher-screen SPA
#   /admin/...       → 静态托管 admin SPA
#   /api/...         → 反代 server:3000
#   /socket.io/...   → 反代 server:3000（WebSocket 升级）
#
# 大屏端访问：http(s)://<domain>/screen
# 管理后台 ：http(s)://<domain>/admin
# 手机扫码 ：http(s)://<domain>/api/v1/courseware-upload/page?s=XXXXXX

upstream snyuan_api {
  server server:3000;
  keepalive 32;
}

# Socket.IO 用的 Upgrade 头切换
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen      80 default_server;
  server_name _;
  # 让 NestJS courseware-upload 的 inferPublicBaseUrl 拿到真实 host
  # （宿主 nginx 反代时也会再传一次 X-Forwarded-* 进来）
  # 客户端上传体积上限：18MB 总（PDF 拆页后），单页 10MB；留 30MB 余量
  client_max_body_size 30M;

  # 长连接 / SSE 友好
  keepalive_timeout  75s;
  send_timeout       3600s;

  # gzip
  gzip               on;
  gzip_vary          on;
  gzip_proxied       any;
  gzip_min_length    1024;
  gzip_types
    text/plain text/css text/javascript application/javascript application/json
    image/svg+xml font/woff font/woff2 application/wasm;

  # 根路径直接送到大屏端首页（演示客户最常用）
  location = / {
    return 302 /screen/;
  }

  # 一个轻量的可视化导航页（在 web-index.html）
  location = /index.html {
    root /usr/share/nginx/html;
  }

  # ─── 大屏端 SPA ──────────────────────────────────────────────────────────
  location /screen/ {
    alias /usr/share/nginx/html/screen/;
    try_files $uri $uri/ /screen/index.html;

    # SPA 入口 html 不要被强缓存，否则更新后客户看不到
    location ~* /screen/index\.html$ {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    # 带 hash 的静态资源放心强缓存
    location ~* /screen/.*\.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }
  }

  # ─── 管理后台 SPA ───────────────────────────────────────────────────────
  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;

    location ~* /admin/index\.html$ {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location ~* /admin/.*\.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }
  }

  # ─── REST API 反代 ──────────────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://snyuan_api;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";   # 利用上游 keepalive

    # SSE / 流式 AI 输出需要禁缓冲
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ─── WebSocket 反代（Socket.IO） ───────────────────────────────────────
  location /socket.io/ {
    proxy_pass         http://snyuan_api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 容器内健康检查（compose healthcheck 用）
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
