<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三元课堂 · 入口导航</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      color: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    .wrap { max-width: 880px; width: 100%; }
    .brand {
      text-align: center; margin-bottom: 32px;
    }
    .brand h1 {
      font-size: clamp(28px, 5vw, 40px);
      margin: 0 0 8px; letter-spacing: 0.05em;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p { margin: 0; color: #94a3b8; font-size: 14px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      display: block; padding: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      text-decoration: none; color: inherit;
      transition: transform .2s, background .2s, border-color .2s;
    }
    .card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(129, 140, 248, 0.5);
    }
    .card .ico {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: rgba(129, 140, 248, 0.2);
      color: #a5b4fc;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 14px;
    }
    .card h2 {
      margin: 0 0 6px; font-size: 18px;
    }
    .card p {
      margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.6;
    }
    .meta {
      margin-top: 32px; text-align: center;
      font-size: 12px; color: #64748b;
    }
    .meta code {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px; border-radius: 4px; font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>三元课堂 · Demo</h1>
      <p>集美工业职业学院 · 多专业通用智慧课堂平台</p>
    </div>
    <div class="cards">
      <a class="card" href="/screen/">
        <div class="ico">📺</div>
        <h2>教室大屏端</h2>
        <p>课堂展示、AI 板书、互动看板 · 浏览器全屏访问</p>
      </a>
      <a class="card" href="/admin/">
        <div class="ico">⚙️</div>
        <h2>管理后台</h2>
        <p>账号管理、课程数据、巡课分析 · admin / admin（演示）</p>
      </a>
      <a class="card" href="/api/docs" target="_blank" rel="noopener">
        <div class="ico">📘</div>
        <h2>API 文档</h2>
        <p>Swagger 接口文档，方便客户端联调与排查</p>
      </a>
      <a class="card" href="/api/v1/ai/providers" target="_blank" rel="noopener">
        <div class="ico">🤖</div>
        <h2>AI 健康检查</h2>
        <p>查看 AI 服务商列表，确认 Qwen / OpenAI 是否就绪</p>
      </a>
    </div>
    <p class="meta">
      教师/学生平板使用独立 App 接入：打包时设置 <code>VITE_API_BASE</code> / <code>VITE_WS_URL</code>
    </p>
  </div>
</body>
</html>
